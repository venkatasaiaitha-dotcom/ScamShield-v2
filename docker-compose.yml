version: '3.8'

services:
  # Official FalkorDB Graph Database container
  falkordb:
    image: falkordb/falkordb:latest
    container_name: scamshield-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  falkordb_data:
    driver: local
